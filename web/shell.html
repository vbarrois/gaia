<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Gaïa</title>
	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
			background: #122523;
			overflow: hidden;
			touch-action: none;
		}
		#canvas:focus { outline: none; }
		#status {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 0.75rem;
			color: #d7e8df;
			font: 500 1rem/1.4 system-ui, sans-serif;
			pointer-events: none;
			background: #122523;
		}
		#status-progress {
			width: min(280px, 70vw);
			height: 8px;
			appearance: none;
			border: 0;
			border-radius: 999px;
			overflow: hidden;
			background: #1e3a34;
		}
		#status-progress::-webkit-progress-bar { background: #1e3a34; }
		#status-progress::-webkit-progress-value { background: #7bc9a6; }
		#status-progress::-moz-progress-bar { background: #7bc9a6; }
		#status.hidden { display: none; }
		#status-notice { opacity: 0.75; font-size: 0.85rem; max-width: 28rem; text-align: center; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas" tabindex="1">
		Ton navigateur ne gère pas le canvas HTML5 (WebGL 2 requis).
	</canvas>
	<div id="status">
		<strong>Gaïa</strong>
		<progress id="status-progress"></progress>
		<div id="status-notice">Chargement du proto…</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const engine = new Engine(GODOT_CONFIG);
		const status = document.getElementById("status");
		const progress = document.getElementById("status-progress");
		const notice = document.getElementById("status-notice");

		function setStatus(text) {
			if (notice) notice.textContent = text || "";
		}

		engine.startGame({
			onProgress: (current, total) => {
				if (total > 0) {
					progress.value = current;
					progress.max = total;
					setStatus(`Chargement ${Math.min(100, Math.round((current / total) * 100))} %`);
				} else {
					setStatus("Téléchargement…");
				}
			},
		}).then(() => {
			status.classList.add("hidden");
		}).catch((err) => {
			progress.style.display = "none";
			setStatus("Impossible de lancer Gaïa. Ouvre la console (F12) pour le détail.");
			console.error(err);
		});
	</script>
</body>
</html>
