<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaïa — relief low-poly</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css?v=soil-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-host"></div>
    <p id="webgl-error" class="webgl-error hidden">WebGL est indisponible.</p>

    <aside id="properties-panel" class="hud panel">
      <div class="panel-head">
        <div class="brand">
          <h1>Gaïa</h1>
          <span class="grid-tag">100 × 100</span>
        </div>
        <div class="head-actions">
          <button
            id="toggle-mute"
            type="button"
            class="ghost icon-btn"
            aria-pressed="false"
            title="Couper le son"
          >
            Son
          </button>
          <button
            id="toggle-panel"
            type="button"
            class="ghost icon-btn"
            aria-controls="panel-body"
            aria-expanded="true"
            title="Réduire le panneau"
          >
            Propriétés
          </button>
        </div>
      </div>
      <div id="panel-body">
      <p class="lede">
        Grille Perlin 100×100, rendue en low-poly avec Three.js. Cliquez-glissez pour orbiter.
      </p>

      <div class="controls">
        <label>
          Graine
          <span></span>
        </label>
        <div class="seed-row">
          <input id="seed" type="number" min="0" step="1" value="1" />
          <button id="random-seed" type="button" class="ghost">Aléatoire</button>
        </div>

        <label>
          Échelle
          <span id="scale-value">28</span>
          <input id="scale" type="range" min="12" max="80" step="1" value="28" />
        </label>
        <label>
          Octaves
          <span id="octaves-value">5</span>
          <input id="octaves" type="range" min="1" max="8" step="1" value="5" />
        </label>
        <label>
          Persistance
          <span id="persistence-value">0.50</span>
          <input id="persistence" type="range" min="0.2" max="0.85" step="0.01" value="0.5" />
        </label>
        <label>
          Lacunarité
          <span id="lacunarity-value">2.10</span>
          <input id="lacunarity" type="range" min="1.4" max="3.2" step="0.05" value="2.1" />
        </label>
        <label>
          Amplitude
          <span id="amplitude-value">20</span>
          <input id="amplitude" type="range" min="4" max="36" step="1" value="20" />
        </label>
        <label>
          Distorsion
          <span id="warp-value">0.35</span>
          <input id="warp" type="range" min="0" max="0.8" step="0.05" value="0.35" />
        </label>
        <label>
          Niveau de l’eau
          <span id="water-value">20%</span>
          <input id="waterLevel" type="range" min="0" max="0.6" step="0.01" value="0.2" />
        </label>
        <p class="section-label">Sol</p>
        <label>
          Hydrométrie
          <span id="hydrometry-value">50%</span>
          <input id="hydrometry" type="range" min="0" max="1" step="0.01" value="0.5" />
        </label>
        <label>
          Pollution
          <span id="pollution-value">15%</span>
          <input id="pollution" type="range" min="0" max="1" step="0.01" value="0.15" />
        </label>
        <p class="section-label">Nuages</p>
        <label>
          Altitude
          <span id="cloud-altitude-value">24</span>
          <input id="cloudAltitude" type="range" min="8" max="48" step="1" value="24" />
        </label>
        <label>
          Couverture
          <span id="cloud-coverage-value">42%</span>
          <input id="cloudCoverage" type="range" min="0" max="1" step="0.01" value="0.42" />
        </label>
      </div>

      <label class="toggle">
        <input id="wireframe" type="checkbox" />
        Fil de fer
      </label>

      <div class="actions">
        <button id="reset" type="button" class="ghost">Réinitialiser</button>
      </div>
      </div>
    </aside>

    <p class="hud hint">R · monde &nbsp;·&nbsp; W · fil de fer &nbsp;·&nbsp; P · panneau &nbsp;·&nbsp; M · son &nbsp;·&nbsp; pincer · zoom</p>
    <p id="stats" class="hud stats">Génération…</p>

    <script type="module" src="./js/app.js?v=soil-8"></script>
  </body>
</html>
